name: buzz

services:
  postgres:
    image: postgres:17-alpine
    container_name: buzz-postgres
    environment:
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: buzz_dev
      POSTGRES_DB: buzz
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - buzz-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2g
    labels:
      com.buzz.service: "postgres"
      com.buzz.env: "dev"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: buzz-redis
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - buzz-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128m
    labels:
      com.buzz.service: "redis"
      com.buzz.env: "dev"
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: buzz-adminer
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - buzz-net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    deploy:
      resources:
        limits:
          memory: 64m
    labels:
      com.buzz.service: "adminer"
      com.buzz.env: "dev"
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: buzz-keycloak
    command: start-dev --http-port=8080
    environment:
      KC_DB: dev-mem
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8180:8080"
    networks:
      - buzz-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    labels:
      com.buzz.service: "keycloak"
      com.buzz.env: "dev"
    restart: unless-stopped

  rustfs:
    # MinIO community images were withdrawn in 2026 and its free code is archived.
    # RustFS keeps the same S3 contract (BUZZ_S3_*), credentials and bucket.
    # Referenced by tag so a `docker load` from ~/buzz-ops/images resolves offline;
    # the tag is pinned to linux/arm64 sha256:42edb61d588775f9431ff436216d14392d2234d4eb2ed68321569fbf7245b36b.
    image: rustfs/rustfs:1.0.0
    container_name: buzz-rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY:?required}
      RUSTFS_SECRET_KEY: ${BUZZ_S3_SECRET_KEY:?required}
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_FTP_ENABLE: "false"
      RUSTFS_FTPS_ENABLE: "false"
      RUSTFS_CHECK_UPDATE: "false"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - rustfs-data:/data
    networks:
      - buzz-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          # RustFS documents 2 GB as its test minimum; it was OOM-killed at 256m
          # holding our 2.3 GiB and used about 730 MiB at 2g.
          memory: 2g
    labels:
      com.buzz.service: "rustfs"
      com.buzz.env: "dev"
    restart: unless-stopped


  prometheus:
    image: prom/prometheus:latest
    container_name: buzz-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - buzz-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 128m
    labels:
      com.buzz.service: "prometheus"
      com.buzz.env: "dev"
    restart: unless-stopped

volumes:
  postgres-data:
    name: buzz-postgres-data
    labels:
      com.buzz.volume: "postgres"
  rustfs-data:
    name: buzz-rustfs-data
  minio-data:
    name: buzz-minio-data
    labels:
      com.buzz.volume: "minio"
  prometheus-data:
    name: buzz-prometheus-data
    labels:
      com.buzz.volume: "prometheus"

networks:
  buzz-net:
    name: buzz-net
    driver: bridge
    labels:
      com.buzz.network: "dev"
