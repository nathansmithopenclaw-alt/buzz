# Smith Crafts owned ACP profile for Buzz — the `deepseek` runtime composition.
# Provisioned by the Buzz desktop into <nest>/.dsh-home/profiles/buzz-acp/ on
# every dsh-agent spawn (write-if-changed); DSH_HOME is redirected there unless
# the operator already set it. Pinned upstream 0.1.1-rc.2.
#
# CREDENTIALS: this profile reads publish credentials (BUZZ_PRIVATE_KEY /
# BUZZ_AUTH_TAG) exclusively from the dsh process environment it inherits from
# buzz-acp's spawn. Nothing here materializes credentials to disk; the owned
# buzz-publish plugin states the same contract in code.
#
# The operator must select an endpoint and model explicitly. The former
# local-v4 router is retired; missing configuration must fail closed.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: disabled
    maxTokens: 4096
    apiKeyEnv: !!js "process.env.DSH_PROVIDER === 'deepseek-hosted' ? 'DEEPSEEK_API_KEY' : 'DSH_API_KEY'"
    baseURL: !!js "(() => { if (process.env.DSH_PROVIDER === 'deepseek-hosted') return 'https://api.deepseek.com'; if (process.env.DSH_PROVIDER && process.env.DSH_PROVIDER !== 'deepseek-compatible') throw new Error('Unsupported DSH_PROVIDER'); if (!process.env.DSH_LLM_BASE_URL) throw new Error('DSH_LLM_BASE_URL is required'); return process.env.DSH_LLM_BASE_URL; })()"
    models:
      - id: !!js "(() => { if (!process.env.DSH_MODEL) throw new Error('DSH_MODEL is required'); return process.env.DSH_MODEL; })()"
        name: !!js process.env.DSH_MODEL
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW || 32768)
        maxTokens: 4096

# Private routing must not inherit the official hosted search provider.
- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  disabled: true

# No configuration hot reload while ACP sessions own scoped processes.
- id: hmr
  name: '@deepseek-ai/cordis-plugin-hmr'
  disabled: true

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.08
    maxTokens: 8192
    compactionRetries: 1

# Autonomous delegation and goal loops remain opt-in in this profile.
- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  disabled: true

- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  disabled: true

- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'
  disabled: true

- id: tool-workflow
  name: '@deepseek-ai/dsh-tool-workflow'
  disabled: true

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
  disabled: true

- id: tool-ralph
  name: '@deepseek-ai/dsh-tool-ralph'
  disabled: true

# The base bundle's persistence services collide with the acp-demo leaf's own
# (duplicate service registration at load); disable them and use the leaf's.
- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  disabled: true

- id: session-query-sqlite
  name: '@deepseek-ai/dsh-session-query-sqlite'
  disabled: true

- insert:
    # Owned publish seam: dsh scrubs credential-shaped env names from bash-tool
    # children, so the model shell can never run `buzz messages send` itself
    # (proven live). This in-process tool invokes the CLI with an explicit env
    # layer instead. Relative path form loads straight from this tree — no
    # registry, no install step.
    - id: buzz-publish
      name: './packages/dsh-buzz-publish/index.js'
    - id: acp-agent
      name: './packages/dsh-acp-buzz/index.js'
      config:
        provider: deepseek-official
        goals: false
        tools:
          mode: native
        model: !!js process.env.DSH_MODEL
        # Session data lives under the redirected DSH home, not the workspace
        # root (cwd-relative paths would drop a stray sessions/ dir there).
        persistenceRoot: ./.dsh-home/sessions
        persistenceCompression: zstd
        workspaceContext:
          maxBytes: 65536
        persona: |
          You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Verify your work by running code or tests. Keep answers brief and factual.
