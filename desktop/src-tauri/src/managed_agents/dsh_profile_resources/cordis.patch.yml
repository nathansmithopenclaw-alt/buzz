# Smith Crafts owned ACP profile for Buzz — the `deepseek` runtime composition.
# Provisioned by the Buzz desktop into <nest>/.dsh-home/profiles/buzz-acp/ on
# every dsh-agent spawn (write-if-changed); DSH_HOME is redirected there unless
# the operator already set it. Pinned upstream 0.1.1-rc.2.
#
# CREDENTIALS: this profile reads publish credentials (BUZZ_PRIVATE_KEY /
# BUZZ_AUTH_TAG) exclusively from the dsh process environment it inherits from
# buzz-acp's spawn. Nothing here materializes credentials to disk; the owned
# buzz-publish plugin states the same contract in code.
#
# LLM traffic goes ONLY to the Smith Crafts Spark router (internal NVMe-served
# vLLM). DSH_API_KEY may hold any non-empty value — the Spark lane does not
# check keys, but the DeepSeek provider refuses to boot without one.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: high
    apiKeyEnv: DSH_API_KEY
    # Deployment-varying LLM endpoint. Defaults to the Smith Crafts Spark
    # router (internal-only topology); operators override with DSH_LLM_BASE_URL.
    # The default literal is a Smith Crafts deployment fact, not a Buzz
    # dependency — swap it out before any upstream-facing packaging of this
    # profile.
    baseURL: !!js process.env.DSH_LLM_BASE_URL || 'http://100.80.202.75:4000/v1'
    models:
      - id: local-v4
        name: DeepSeek-V4-Flash (Spark local-v4)

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.08
    maxTokens: 8192
    compactionRetries: 1

# The base bundle's persistence services collide with the acp-demo leaf's own
# (duplicate service registration at load); disable them and use the leaf's.
- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  disabled: true

- id: session-query-sqlite
  name: '@deepseek-ai/dsh-session-query-sqlite'
  disabled: true

- insert:
    # Owned publish seam: dsh scrubs credential-shaped env names from bash-tool
    # children, so the model shell can never run `buzz messages send` itself
    # (proven live). This in-process tool invokes the CLI with an explicit env
    # layer instead. Relative path form loads straight from this tree — no
    # registry, no install step.
    - id: buzz-publish
      name: './packages/dsh-buzz-publish/index.js'
    - id: acp-agent
      name: '@deepseek-ai/dsh-acp-demo'
      config:
        provider: deepseek-official
        model: local-v4
        # Session data lives under the redirected DSH home, not the workspace
        # root (cwd-relative paths would drop a stray sessions/ dir there).
        persistenceRoot: ./.dsh-home/sessions
        persistenceCompression: zstd
        workspaceContext:
          maxBytes: 65536
        persona: |
          You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Verify your work by running code or tests. Keep answers brief and factual.
